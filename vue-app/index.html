<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#111214" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // тема до першого кадру — без білого спалаху на темній темі
      try { document.documentElement.dataset.theme = (function (v) { return v === 'steel' || v === 'khaki' ? v : 'brand' })(localStorage.getItem('bt_theme')) } catch (e) { document.documentElement.dataset.theme = 'brand' }
    </script>
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>Брухтарня</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
